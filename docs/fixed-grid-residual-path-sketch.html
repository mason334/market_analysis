  &lt;section class=&quot;fg-chart&quot; aria-labelledby=&quot;fg-price-title&quot;&gt;
    &lt;div id=&quot;fg-price-title&quot; class=&quot;fg-chart-title&quot;&gt;实际路径、基线、固定锚点与重建草图&lt;/div&gt;
    &lt;div id=&quot;fg-price-chart&quot;&gt;&lt;/div&gt;

  &lt;section class=&quot;fg-chart&quot; aria-labelledby=&quot;fg-residual-title&quot;&gt;
    &lt;div id=&quot;fg-residual-title&quot; class=&quot;fg-chart-title&quot;&gt;残差空间：完整残差与真正保存的锚点值&lt;/div&gt;
    &lt;div id=&quot;fg-residual-chart&quot;&gt;&lt;/div&gt;

  &lt;div id=&quot;fg-tooltip&quot; class=&quot;tooltip&quot; role=&quot;tooltip&quot;&gt;&lt;/div&gt;
  &lt;div id=&quot;fg-summary&quot; class=&quot;sr-only&quot; aria-live=&quot;polite&quot;&gt;&lt;/div&gt;

  &lt;script src=&quot;https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js&quot;&gt;&lt;/script&gt;
  &lt;script&gt;
    (() =&gt; {
      const root = document.getElementById(&#x27;fg-residual-sketch&#x27;);
      const scenarioSelect = root.querySelector(&#x27;#fg-scenario&#x27;);
      const kSelect = root.querySelector(&#x27;#fg-k&#x27;);
      const tailToggle = root.querySelector(&#x27;#fg-tail&#x27;);
      const meta = root.querySelector(&#x27;#fg-meta&#x27;);
      const collisionNote = root.querySelector(&#x27;#fg-collision-note&#x27;);
      const fingerprint = root.querySelector(&#x27;#fg-fingerprint&#x27;);
      const summary = root.querySelector(&#x27;#fg-summary&#x27;);
      const tooltip = root.querySelector(&#x27;#fg-tooltip&#x27;);
      const reducedMotion = window.matchMedia(&#x27;(prefers-reduced-motion: reduce)&#x27;);
      const layerState = { actual: true, baseline: true, anchors: true, recon: true };
      let current = null;

      const cumulative = (returns) =&gt; {
        const values = [0];
        returns.forEach((value) =&gt; values.push(values[values.length - 1] + value));
        return values;
      };

      const interpolateControlPoints = (points) =&gt; {
        const values = [];
        for (let t = 0; t &lt; 60; t += 1) {
          let right = 1;
          while (right &lt; points.length - 1 &amp;&amp; t &gt; points[right][0]) right += 1;
          const left = right - 1;
          const [t0, y0] = points[left];
          const [t1, y1] = points[right];
          const ratio = t1 === t0 ? 0 : (t - t0) / (t1 - t0);
          values.push(y0 + ratio * (y1 - y0));
        }
        return values;
      };

      const scenarios = {
        &#x27;deep-v&#x27;: {
          label: &#x27;同指标 A · 深 V&#x27;,
          values: () =&gt; cumulative([
            ...Array(29).fill(-0.01),
            ...Array(30).fill(0.01)
          ]),
          collision: &#x27;A 与 B 的 G01/G02/G03/G04/G05/G07/T03/T04 完全相同，但固定锚点序列不同。&#x27;
        },
        chop: {
          label: &#x27;同指标 B · 震荡突破&#x27;,
          values: () =&gt; cumulative([
            ...Array.from({ length: 58 }, (_, index) =&gt; index % 2 === 0 ? -0.01 : 0.01),
            0.01
          ]),
          collision: &#x27;A 与 B 的 G01/G02/G03/G04/G05/G07/T03/T04 完全相同，但固定锚点序列不同。&#x27;
        },
        &#x27;double-turn&#x27;: {
          label: &#x27;双转折&#x27;,
          values: () =&gt; interpolateControlPoints([[0, 0], [16, 0.18], [35, -0.12], [59, 0.09]])
            .map((value, t) =&gt; value + 0.008 * Math.sin(Math.PI * t / 59) * Math.sin(2 * Math.PI * t / 9)),
          collision: &#x27;固定网格保留两次主要方向变化；网格越密，局部拐点越接近实际路径。&#x27;
        },
        &#x27;terminal-shock&#x27;: {
          label: &#x27;末端冲击&#x27;,
          values: () =&gt; interpolateControlPoints([[0, 0], [20, 0.02], [40, 0.005], [54, 0.015], [58, 0.018], [59, 0.19]])
            .map((value, t) =&gt; value + 0.006 * Math.sin(Math.PI * t / 59) * Math.sin(2 * Math.PI * t / 20)),
          collision: &#x27;规则网格会把最后一天冲击向前摊入最后一段；加入 Day 58 尾部锚点可显著减少这种失真。&#x27;
        }
      };

      const sampleStd = (values) =&gt; {
        const returns = values.slice(1).map((value, index) =&gt; value - values[index]);
        const mean = d3.mean(returns);
        return Math.sqrt(d3.sum(returns, (value) =&gt; (value - mean) ** 2) / (returns.length - 1));
      };

      const pathMetrics = (values) =&gt; {
        const returns = values.slice(1).map((value, index) =&gt; value - values[index]);
        const n = returns.length;
        const displacement = values[n] - values[0];
        const totalVariation = d3.sum(returns, (value) =&gt; Math.abs(value));
        const dailyStd = sampleStd(values);
        const terminal = values[n];
        const prior = values.slice(0, n);
        const priorHigh = d3.max(prior);
        const priorLow = d3.min(prior);
        const fullLow = d3.min(values);
        const fullHigh = d3.max(values);
        const fullRange = fullHigh - fullLow;
        const rank = d3.sum(prior, (value) =&gt; value &lt; terminal ? 1 : value === terminal ? 0.5 : 0) / n;
        const extension = Math.max(terminal - priorHigh, 0) - Math.max(priorLow - terminal, 0);
        const qv = d3.sum(returns, (value) =&gt; value ** 2);
        const weights = qv === 0 ? returns.map(() =&gt; 0) : returns.map((value) =&gt; value ** 2 / qv);
        const herfindahl = d3.sum(weights, (value) =&gt; value ** 2);
        return {
          G01: displacement,
          G02: totalVariation === 0 ? 0 : Math.abs(displacement) / totalVariation,
          G03: 100 * Math.sqrt(252) * dailyStd,
          G04: rank,
          G05: fullRange === 0 ? 0.5 : (terminal - fullLow) / fullRange,
          G07: extension === 0 ? 0 : dailyStd === 0 ? null : extension / dailyStd,
          T03: qv === 0 ? 0.5 : d3.sum(weights, (weight, index) =&gt; ((index + 1) - 0.5) * weight / n),
          T04: qv === 0 ? 0 : Math.max(0, 1 - 1 / (n * herfindahl))
        };
      };

      const linearAt = (points, xValue) =&gt; {
        if (xValue &lt;= points[0].t) return points[0].value;
        if (xValue &gt;= points[points.length - 1].t) return points[points.length - 1].value;
        let right = 1;
        while (right &lt; points.length &amp;&amp; xValue &gt; points[right].t) right += 1;
        const left = right - 1;
        const ratio = (xValue - points[left].t) / (points[right].t - points[left].t);
        return points[left].value + ratio * (points[right].value - points[left].value);
      };

      const interpolateSamples = (values, xValue) =&gt; {
        const left = Math.max(0, Math.min(58, Math.floor(xValue)));
        const right = Math.min(59, left + 1);
        const ratio = xValue - left;
        return values[left] + ratio * (values[right] - values[left]);
      };

      const buildModel = () =&gt; {
        const scenario = scenarios[scenarioSelect.value];
        const actual = scenario.values();
        const K = Number(kSelect.value);
        const anchorIndices = Array.from({ length: K + 1 }, (_, j) =&gt; Math.round(59 * j / K));
        if (tailToggle.checked &amp;&amp; !anchorIndices.includes(58)) anchorIndices.push(58);
        anchorIndices.sort((a, b) =&gt; a - b);

        const displacement = actual[59] - actual[0];
        const baseline = actual.map((_, t) =&gt; actual[0] + t * displacement / 59);
        const residual = actual.map((value, t) =&gt; value - baseline[t]);
        const anchors = anchorIndices.map((t) =&gt; ({ t, value: residual[t] }));
        const residualHat = actual.map((_, t) =&gt; linearAt(anchors, t));
        const recon = baseline.map((value, t) =&gt; value + residualHat[t]);
        const priceErrors = recon.map((value, t) =&gt; 100 * (Math.exp(value - actual[t]) - 1));
        const rmse = Math.sqrt(d3.mean(priceErrors, (value) =&gt; value ** 2));
        const maxError = d3.max(priceErrors, (value) =&gt; Math.abs(value));
        const dailyStd = sampleStd(actual);
        const nrmse = dailyStd === 0
          ? 0
          : Math.sqrt(d3.mean(actual.map((value, t) =&gt; (value - recon[t]) ** 2))) / (dailyStd * Math.sqrt(59));

        return {
          scenario,
          K,
          actual,
          baseline,
          residual,
          anchors,
          residualHat,
          recon,
          priceErrors,
          rmse,
          maxError,
          nrmse,
          metrics: pathMetrics(actual),
          storedValues: anchors.length - 2
        };
      };

      const transitionFor = (selection, animate) =&gt; {
        if (!animate || reducedMotion.matches) return selection;
        return selection.transition().duration(320).ease(d3.easeCubicOut);
      };

      const showTooltip = (event, rows) =&gt; {
        tooltip.innerHTML = rows.map(([key, value]) =&gt;
          `&lt;div class=&quot;tooltip-row&quot;&gt;&lt;span class=&quot;tooltip-key&quot;&gt;${key}&lt;/span&gt;&lt;span&gt;${value}&lt;/span&gt;&lt;/div&gt;`
        ).join(&#x27;&#x27;);
        tooltip.style.display = &#x27;block&#x27;;
        const rootRect = root.getBoundingClientRect();
        const tooltipRect = tooltip.getBoundingClientRect();
        let left = event.clientX - rootRect.left + 12;
        let top = event.clientY - rootRect.top + 12;
        if (left + tooltipRect.width &gt; rootRect.width - 4) left -= tooltipRect.width + 24;
        if (top + tooltipRect.height &gt; rootRect.height - 4) top -= tooltipRect.height + 24;
        tooltip.style.left = `${Math.max(4, left)}px`;
        tooltip.style.top = `${Math.max(4, top)}px`;
      };

      const hideTooltip = () =&gt; { tooltip.style.display = &#x27;none&#x27;; };

      const drawChart = (containerId, type, animate) =&gt; {
        const container = root.querySelector(containerId);
        const width = Math.max(320, container.clientWidth || 736);
        const height = type === &#x27;price&#x27; ? 330 : 250;
        const margin = { top: 24, right: 22, bottom: 52, left: 70 };
        const innerWidth = width - margin.left - margin.right;
        const innerHeight = height - margin.top - margin.bottom;
        const svg = d3.select(container).selectAll(&#x27;svg&#x27;).data([null]).join(&#x27;svg&#x27;)
          .attr(&#x27;viewBox&#x27;, `0 0 ${width} ${height}`)
          .attr(&#x27;role&#x27;, &#x27;img&#x27;)
          .attr(&#x27;aria-label&#x27;, type === &#x27;price&#x27;
            ? `${current.scenario.label} 的实际路径、基线、锚点和重建路径`
            : `${current.scenario.label} 的完整残差、锚点和插值残差`);

        svg.selectAll(&#x27;title&#x27;).data([null]).join(&#x27;title&#x27;)
          .text(type === &#x27;price&#x27; ? &#x27;实际路径与固定网格重建&#x27; : &#x27;残差锚点与插值&#x27;);
        svg.selectAll(&#x27;desc&#x27;).data([null]).join(&#x27;desc&#x27;)
          .text(type === &#x27;price&#x27;
            ? &#x27;横轴为窗口内交易日，纵轴为相对起点的累计对数价格变化百分比。&#x27;
            : &#x27;横轴为窗口内交易日，纵轴为实际路径相对起终点直线的残差百分比。&#x27;);

        const plot = svg.selectAll(&#x27;g.plot&#x27;).data([null]).join(&#x27;g&#x27;)
          .attr(&#x27;class&#x27;, &#x27;plot&#x27;)
          .attr(&#x27;transform&#x27;, `translate(${margin.left},${margin.top})`);
        const x = d3.scaleLinear().domain([0, 59]).range([0, innerWidth]);

        const valuesForDomain = type === &#x27;price&#x27;
          ? [
              ...(layerState.actual ? current.actual : []),
              ...(layerState.baseline ? current.baseline : []),
              ...(layerState.recon ? current.recon : []),
              ...(layerState.anchors ? current.anchors.map((d) =&gt; current.baseline[d.t] + d.value) : [])
            ]
          : [
              0,
              ...(layerState.anchors ? current.residual : []),
              ...(layerState.recon ? current.residualHat : [])
            ];
        const domainValues = valuesForDomain.length &gt; 1 ? valuesForDomain : [0, 0.01];
        const extent = d3.extent(domainValues);
        const span = Math.max(0.01, extent[1] - extent[0]);
        const y = d3.scaleLinear()
          .domain([extent[0] - span * 0.12, extent[1] + span * 0.12])
          .nice()
          .range([innerHeight, 0]);

        const tickCount = width &lt; 430 ? 4 : 7;
        const xAxis = d3.axisBottom(x).ticks(tickCount).tickFormat((value) =&gt; `D${Math.round(value)}`);
        const yAxis = d3.axisLeft(y).ticks(6).tickFormat((value) =&gt; `${(100 * value).toFixed(0)}%`);
        plot.selectAll(&#x27;g.x-axis&#x27;).data([null]).join(&#x27;g&#x27;)
          .attr(&#x27;class&#x27;, &#x27;x-axis&#x27;)
          .attr(&#x27;transform&#x27;, `translate(0,${innerHeight})`)
          .call(xAxis);
        plot.selectAll(&#x27;g.y-axis&#x27;).data([null]).join(&#x27;g&#x27;)
          .attr(&#x27;class&#x27;, &#x27;y-axis&#x27;)
          .call(yAxis);
        plot.selectAll(&#x27;g.grid&#x27;).data([null]).join(&#x27;g&#x27;)
          .attr(&#x27;class&#x27;, &#x27;grid&#x27;)
          .call(d3.axisLeft(y).ticks(6).tickSize(-innerWidth).tickFormat(&#x27;&#x27;))
          .call((g) =&gt; g.select(&#x27;.domain&#x27;).remove());

        plot.selectAll(&#x27;rect[data-chart-frame]&#x27;).data([null]).join(&#x27;rect&#x27;)
          .attr(&#x27;data-chart-frame&#x27;, &#x27;&#x27;)
          .attr(&#x27;x&#x27;, 0).attr(&#x27;y&#x27;, 0)
          .attr(&#x27;width&#x27;, innerWidth).attr(&#x27;height&#x27;, innerHeight)
          .attr(&#x27;fill&#x27;, &#x27;none&#x27;).attr(&#x27;stroke&#x27;, &#x27;var(--border)&#x27;);

        svg.selectAll(&#x27;text.x-title&#x27;).data([null]).join(&#x27;text&#x27;)
          .attr(&#x27;class&#x27;, &#x27;axis-title x-title&#x27;)
          .attr(&#x27;data-axis&#x27;, &#x27;x&#x27;)
          .attr(&#x27;x&#x27;, margin.left + innerWidth / 2)
          .attr(&#x27;y&#x27;, height - 8)
          .attr(&#x27;text-anchor&#x27;, &#x27;middle&#x27;)
          .text(&#x27;窗口位置（交易日）&#x27;);
        svg.selectAll(&#x27;text.y-title&#x27;).data([null]).join(&#x27;text&#x27;)
          .attr(&#x27;class&#x27;, &#x27;axis-title y-title&#x27;)
          .attr(&#x27;data-axis&#x27;, &#x27;y&#x27;)
          .attr(&#x27;transform&#x27;, `translate(16,${margin.top + innerHeight / 2}) rotate(-90)`)
          .attr(&#x27;text-anchor&#x27;, &#x27;middle&#x27;)
          .text(type === &#x27;price&#x27; ? &#x27;累计 log-price 变化（%）&#x27; : &#x27;相对基线残差（%）&#x27;);

        const line = d3.line()
          .x((d) =&gt; x(d.t))
          .y((d) =&gt; y(d.value));
        const series = current.actual.map((_, t) =&gt; ({
          t,
          actual: current.actual[t],
          baseline: current.baseline[t],
          recon: current.recon[t],
          residual: current.residual[t],
          residualHat: current.residualHat[t]
        }));

        const setPath = (className, data, visible, stroke, widthValue, dash) =&gt; {
          const path = plot.selectAll(`path.${className}`).data(visible ? [data] : []);
          path.exit().remove();
          const entered = path.enter().append(&#x27;path&#x27;)
            .attr(&#x27;class&#x27;, className)
            .attr(&#x27;fill&#x27;, &#x27;none&#x27;)
            .attr(&#x27;stroke&#x27;, stroke)
            .attr(&#x27;stroke-width&#x27;, widthValue)
            .attr(&#x27;stroke-linejoin&#x27;, &#x27;round&#x27;)
            .attr(&#x27;stroke-linecap&#x27;, &#x27;round&#x27;)
            .attr(&#x27;stroke-dasharray&#x27;, dash || null);
          transitionFor(entered.merge(path), animate).attr(&#x27;d&#x27;, line);
        };

        if (type === &#x27;price&#x27;) {
          setPath(&#x27;actual-line&#x27;, series.map((d) =&gt; ({ t: d.t, value: d.actual })), layerState.actual, &#x27;var(--viz-series-1)&#x27;, 2.2, null);
          setPath(&#x27;baseline-line&#x27;, series.map((d) =&gt; ({ t: d.t, value: d.baseline })), layerState.baseline, &#x27;var(--viz-series-4)&#x27;, 1.5, &#x27;6 4&#x27;);
          setPath(&#x27;recon-line&#x27;, series.map((d) =&gt; ({ t: d.t, value: d.recon })), layerState.recon, &#x27;var(--viz-series-2)&#x27;, 2.2, &#x27;10 3&#x27;);

          const anchorData = layerState.anchors ? current.anchors.map((d, index) =&gt; ({
            t: d.t,
            residual: d.value,
            baseline: current.baseline[d.t],
            actual: current.actual[d.t],
            index
          })) : [];
          plot.selectAll(&#x27;line.anchor-stem&#x27;).data(anchorData, (d) =&gt; d.t).join(
            (enter) =&gt; enter.append(&#x27;line&#x27;).attr(&#x27;class&#x27;, &#x27;anchor-stem&#x27;)
              .attr(&#x27;x1&#x27;, (d) =&gt; x(d.t)).attr(&#x27;x2&#x27;, (d) =&gt; x(d.t))
              .attr(&#x27;y1&#x27;, (d) =&gt; y(d.baseline)).attr(&#x27;y2&#x27;, (d) =&gt; y(d.baseline))
              .attr(&#x27;stroke&#x27;, &#x27;var(--viz-series-3)&#x27;).attr(&#x27;stroke-width&#x27;, 1.2),
            (update) =&gt; update,
            (exit) =&gt; exit.remove()
          ).call((selection) =&gt; transitionFor(selection, animate)
            .attr(&#x27;x1&#x27;, (d) =&gt; x(d.t)).attr(&#x27;x2&#x27;, (d) =&gt; x(d.t))
            .attr(&#x27;y1&#x27;, (d) =&gt; y(d.baseline)).attr(&#x27;y2&#x27;, (d) =&gt; y(d.actual)));
          plot.selectAll(&#x27;circle.anchor-dot&#x27;).data(anchorData, (d) =&gt; d.t).join(
            (enter) =&gt; enter.append(&#x27;circle&#x27;).attr(&#x27;class&#x27;, &#x27;anchor-dot&#x27;)
              .attr(&#x27;r&#x27;, 4).attr(&#x27;fill&#x27;, &#x27;var(--viz-series-3)&#x27;),
            (update) =&gt; update,
            (exit) =&gt; exit.remove()
          ).call((selection) =&gt; transitionFor(selection, animate)
            .attr(&#x27;cx&#x27;, (d) =&gt; x(d.t)).attr(&#x27;cy&#x27;, (d) =&gt; y(d.actual)));

          const annotationData = width &gt;= 560 &amp;&amp; layerState.anchors
            ? [anchorData[Math.floor(anchorData.length / 2)]]
            : [];
          plot.selectAll(&#x27;text.anchor-label&#x27;).data(annotationData).join(&#x27;text&#x27;)
            .attr(&#x27;class&#x27;, &#x27;anchor-label&#x27;)
            .attr(&#x27;x&#x27;, (d) =&gt; Math.min(innerWidth - 8, x(d.t) + 8))
            .attr(&#x27;y&#x27;, (d) =&gt; y(d.actual) - 8)
            .attr(&#x27;text-anchor&#x27;, (d) =&gt; x(d.t) &gt; innerWidth * 0.75 ? &#x27;end&#x27; : &#x27;start&#x27;)
            .text((d) =&gt; `保存残差 e${d.index}`);
          plot.selectAll(&#x27;text.endpoint-label&#x27;).data(width &gt;= 560 &amp;&amp; layerState.recon ? [series[59]] : []).join(&#x27;text&#x27;)
            .attr(&#x27;class&#x27;, &#x27;endpoint-label&#x27;)
            .attr(&#x27;x&#x27;, innerWidth - 6)
            .attr(&#x27;y&#x27;, (d) =&gt; Math.max(14, y(d.actual) - 9))
            .attr(&#x27;text-anchor&#x27;, &#x27;end&#x27;)
            .text(&#x27;终点严格匹配&#x27;);
        } else {
          setPath(&#x27;residual-line&#x27;, series.map((d) =&gt; ({ t: d.t, value: d.residual })), layerState.anchors, &#x27;var(--viz-series-1)&#x27;, 1.8, null);
          setPath(&#x27;residual-hat-line&#x27;, series.map((d) =&gt; ({ t: d.t, value: d.residualHat })), layerState.recon, &#x27;var(--viz-series-2)&#x27;, 2.2, &#x27;10 3&#x27;);
          plot.selectAll(&#x27;line.zero-line&#x27;).data([null]).join(&#x27;line&#x27;)
            .attr(&#x27;class&#x27;, &#x27;zero-line&#x27;)
            .attr(&#x27;x1&#x27;, 0).attr(&#x27;x2&#x27;, innerWidth)
            .attr(&#x27;y1&#x27;, y(0)).attr(&#x27;y2&#x27;, y(0))
            .attr(&#x27;stroke&#x27;, &#x27;var(--border)&#x27;).attr(&#x27;stroke-width&#x27;, 1);
          const residualAnchors = layerState.anchors ? current.anchors : [];
          plot.selectAll(&#x27;circle.residual-anchor&#x27;).data(residualAnchors, (d) =&gt; d.t).join(
            (enter) =&gt; enter.append(&#x27;circle&#x27;).attr(&#x27;class&#x27;, &#x27;residual-anchor&#x27;)
              .attr(&#x27;r&#x27;, 4).attr(&#x27;fill&#x27;, &#x27;var(--viz-series-3)&#x27;),
            (update) =&gt; update,
            (exit) =&gt; exit.remove()
          ).call((selection) =&gt; transitionFor(selection, animate)
            .attr(&#x27;cx&#x27;, (d) =&gt; x(d.t)).attr(&#x27;cy&#x27;, (d) =&gt; y(d.value)));
          plot.selectAll(&#x27;text.residual-note&#x27;).data(width &gt;= 560 &amp;&amp; layerState.anchors ? [null] : []).join(&#x27;text&#x27;)
            .attr(&#x27;class&#x27;, &#x27;residual-note&#x27;)
            .attr(&#x27;x&#x27;, 8).attr(&#x27;y&#x27;, 16)
            .text(`仅保存 ${current.storedValues} 个内部残差；每日残差不持久化`);
        }

        const guide = plot.selectAll(&#x27;line[data-chart-hover-guide]&#x27;).data([null]).join(&#x27;line&#x27;)
          .attr(&#x27;data-chart-hover-guide&#x27;, &#x27;&#x27;)
          .attr(&#x27;y1&#x27;, 0).attr(&#x27;y2&#x27;, innerHeight)
          .attr(&#x27;stroke&#x27;, &#x27;var(--foreground)&#x27;).attr(&#x27;stroke-opacity&#x27;, 0.45)
          .attr(&#x27;stroke-width&#x27;, 1).style(&#x27;display&#x27;, &#x27;none&#x27;);
        const markerLayer = plot.selectAll(&#x27;g.hover-markers&#x27;).data([null]).join(&#x27;g&#x27;).attr(&#x27;class&#x27;, &#x27;hover-markers&#x27;);
        const overlay = plot.selectAll(&#x27;rect[data-chart-hit]&#x27;).data([null]).join(&#x27;rect&#x27;)
          .attr(&#x27;data-chart-hit&#x27;, &#x27;&#x27;)
          .attr(&#x27;data-chart-hover-overlay&#x27;, &#x27;cross-series&#x27;)
          .attr(&#x27;x&#x27;, 0).attr(&#x27;y&#x27;, 0)
          .attr(&#x27;width&#x27;, innerWidth).attr(&#x27;height&#x27;, innerHeight)
          .attr(&#x27;fill&#x27;, &#x27;transparent&#x27;)
          .style(&#x27;cursor&#x27;, &#x27;crosshair&#x27;);

        overlay.on(&#x27;pointermove&#x27;, (event) =&gt; {
          const [pointerX] = d3.pointer(event, overlay.node());
          const day = Math.max(0, Math.min(59, x.invert(pointerX)));
          guide.attr(&#x27;x1&#x27;, x(day)).attr(&#x27;x2&#x27;, x(day)).style(&#x27;display&#x27;, null);
          let markerRows;
          let tooltipRows = [[&#x27;窗口位置&#x27;, `Day ${day.toFixed(1)}`]];
          if (type === &#x27;price&#x27;) {
            markerRows = [
              layerState.actual &amp;&amp; { label: &#x27;实际路径&#x27;, value: interpolateSamples(current.actual, day), color: &#x27;var(--viz-series-1)&#x27; },
              layerState.baseline &amp;&amp; { label: &#x27;起终点基线&#x27;, value: interpolateSamples(current.baseline, day), color: &#x27;var(--viz-series-4)&#x27; },
              layerState.recon &amp;&amp; { label: &#x27;重建路径&#x27;, value: interpolateSamples(current.recon, day), color: &#x27;var(--viz-series-2)&#x27; }
            ].filter(Boolean);
          } else {
            markerRows = [
              layerState.anchors &amp;&amp; { label: &#x27;完整残差&#x27;, value: interpolateSamples(current.residual, day), color: &#x27;var(--viz-series-1)&#x27; },
              layerState.recon &amp;&amp; { label: &#x27;插值残差&#x27;, value: interpolateSamples(current.residualHat, day), color: &#x27;var(--viz-series-2)&#x27; }
            ].filter(Boolean);
          }
          tooltipRows = tooltipRows.concat(markerRows.map((row) =&gt; [row.label, `${(100 * row.value).toFixed(2)}%`]));
          markerLayer.selectAll(&#x27;circle[data-chart-hover-marker]&#x27;).data(markerRows, (d) =&gt; d.label).join(&#x27;circle&#x27;)
            .attr(&#x27;data-chart-hover-marker&#x27;, &#x27;&#x27;)
            .attr(&#x27;cx&#x27;, x(day)).attr(&#x27;cy&#x27;, (d) =&gt; y(d.value))
            .attr(&#x27;r&#x27;, 4).attr(&#x27;fill&#x27;, (d) =&gt; d.color)
            .attr(&#x27;stroke&#x27;, &#x27;var(--background)&#x27;).attr(&#x27;stroke-width&#x27;, 1.5);
          showTooltip(event, tooltipRows);
        }).on(&#x27;pointerleave&#x27;, () =&gt; {
          guide.style(&#x27;display&#x27;, &#x27;none&#x27;);
          markerLayer.selectAll(&#x27;*&#x27;).remove();
          hideTooltip();
        });
      };

      const updateText = () =&gt; {
        meta.innerHTML = [
          `&lt;span&gt;&lt;strong&gt;60&lt;/strong&gt; observations → &lt;strong&gt;${current.storedValues}&lt;/strong&gt; stored residuals&lt;/span&gt;`,
          `&lt;span&gt;价格 RMSE &lt;strong&gt;${current.rmse.toFixed(2)}%&lt;/strong&gt;&lt;/span&gt;`,
          `&lt;span&gt;最大价格误差 &lt;strong&gt;${current.maxError.toFixed(2)}%&lt;/strong&gt;&lt;/span&gt;`,
          `&lt;span&gt;标准化路径 RMSE &lt;strong&gt;${(100 * current.nrmse).toFixed(1)}%&lt;/strong&gt;&lt;/span&gt;`
        ].join(&#x27;&#x27;);
        collisionNote.textContent = current.scenario.collision;
        const metric = current.metrics;
        fingerprint.textContent = `G/T 指标指纹：G01 ${(100 * metric.G01).toFixed(2)}% · G02 ${metric.G02.toFixed(4)} · G03 ${metric.G03.toFixed(2)}% · G04 ${metric.G04.toFixed(3)} · G05 ${metric.G05.toFixed(3)} · G07 ${metric.G07 === null ? &#x27;NULL&#x27; : `${metric.G07.toFixed(3)}σ`} · T03 ${metric.T03.toFixed(3)} · T04 ${metric.T04.toFixed(3)}`;
        summary.textContent = `${current.scenario.label}，固定网格 K 等于 ${current.K}，保存 ${current.storedValues} 个内部残差，价格均方根误差 ${current.rmse.toFixed(2)}%，最大价格误差 ${current.maxError.toFixed(2)}%。`;
      };

      const render = (animate = true) =&gt; {
        current = buildModel();
        updateText();
        drawChart(&#x27;#fg-price-chart&#x27;, &#x27;price&#x27;, animate);
        drawChart(&#x27;#fg-residual-chart&#x27;, &#x27;residual&#x27;, animate);
      };

      scenarioSelect.addEventListener(&#x27;change&#x27;, () =&gt; render(true));
      kSelect.addEventListener(&#x27;change&#x27;, () =&gt; render(true));
      tailToggle.addEventListener(&#x27;change&#x27;, () =&gt; render(true));
      root.querySelectorAll(&#x27;[data-layer]&#x27;).forEach((button) =&gt; {
        button.addEventListener(&#x27;click&#x27;, () =&gt; {
          const layer = button.dataset.layer;
          layerState[layer] = !layerState[layer];
          button.setAttribute(&#x27;aria-pressed&#x27;, String(layerState[layer]));
          render(false);
        });
      });

      const resizeObserver = new ResizeObserver(() =&gt; {
        if (current) render(false);
      });
      resizeObserver.observe(root.querySelector(&#x27;#fg-price-chart&#x27;));
      resizeObserver.observe(root.querySelector(&#x27;#fg-residual-chart&#x27;));
      render(false);
    })();
  &lt;/script&gt;
&lt;/div&gt;

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute(&quot;aria-describedby&quot;);
    } else {
      trigger.setAttribute(&quot;aria-describedby&quot;, [...ids].join(&quot; &quot;));
    }
  };
  const clearOpenTimeout = () =&gt; {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) =&gt; {
    clearOpenTimeout();
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) =&gt; {
    const request = ++positionRequest;
