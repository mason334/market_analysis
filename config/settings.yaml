indicators:
  support_resistance:
    swing_order: 3
    cluster_pct: 1.5
    min_touches: 2
    min_span_days: 10
    max_levels: 10
    max_dist_pct: 20
    extreme_order: 60
    extreme_pct: 5.0
    lookback_window: 500
    atr_period: 14
    watch_atr_mult: 1.5
    warn_atr_mult: 0.5
    breakout_window: 5

  trend:
    windows:
      - {label: 5d, far_bars: 5, near_bars: 0}
      - {label: 10d, far_bars: 10, near_bars: 0}
      - {label: 20d, far_bars: 20, near_bars: 0}
      - {label: 40d, far_bars: 40, near_bars: 0}
      - {label: 60d, far_bars: 60, near_bars: 0}

# Backward-compatible alias for older code paths and saved prefs.
strategies:
  support_resistance:
    swing_order: 3
    cluster_pct: 1.5
    min_touches: 2
    min_span_days: 10
    max_levels: 10
    max_dist_pct: 20
    extreme_order: 60
    extreme_pct: 5.0
    lookback_window: 500
    atr_period: 14
    watch_atr_mult: 1.5
    warn_atr_mult: 0.5
    breakout_window: 5

pipeline:
  min_bars: 40
  source: tiingo
